<!DOCTYPE html>
<!--
================================================================================================
  ARCHIVO: index.html  (SHELL / lanzador)
  UBICACIÓN CORRECTA: repositorio de GITHUB PAGES (junto a manifest.json, sw.js e icons/)
  NO PEGAR EN APPS SCRIPT.

  Este archivo NO contiene la aplicación. Es solo el lanzador: aporta el manifest y los íconos
  (lo que hace que Android la reconozca como app instalable) y redirige de inmediato a la Web
  App real de Apps Script.

  La aplicación completa es portaltecnicos.html (~2.270 líneas) y vive en Apps Script, NO aquí.
================================================================================================
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SERTEC · Portal Técnico</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <meta name="theme-color" content="#0284c7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SERTEC">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <style>
    html, body { margin:0; padding:0; height:100%; background:#f8fafc; overflow:hidden; }

    /* Pantalla de arranque mientras se dispara la redirección hacia Apps Script.
       Dura muy poco (la redirección es casi instantánea), pero evita un flash en blanco
       al abrir la app desde el ícono del escritorio/APK. */
    #splash {
      position:fixed; inset:0; background:#f8fafc; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:12px;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #splash .logo {
      width:64px; height:64px; border-radius:20px; background:linear-gradient(135deg,#0284c7,#0369a1);
      display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:26px;
      box-shadow:0 10px 24px -8px rgba(2,132,199,.5);
    }
    #splash .txt { color:#64748b; font-size:13px; font-weight:600; }
    #splash .anillo {
      width:22px; height:22px; border:3px solid rgba(2,132,199,.2); border-top-color:#0284c7;
      border-radius:50%; animation:girar .8s linear infinite;
    }
    @keyframes girar { to { transform:rotate(360deg); } }

    /* Aviso solo si la redirección misma no se pudo disparar (variable mal puesta, sin JS) */
    #avisoError {
      position:fixed; inset:0; background:#f8fafc; display:none; align-items:center; justify-content:center;
      padding:24px; text-align:center; font-family: system-ui, -apple-system, sans-serif;
    }
    #avisoError.visible { display:flex; }
    #avisoError .caja { max-width:360px; }
    #avisoError h1 { font-size:16px; color:#0f172a; margin:0 0 8px; }
    #avisoError p { font-size:13px; color:#64748b; margin:0 0 16px; line-height:1.5; }
    #avisoError a {
      display:inline-block; background:#0284c7; color:#fff; text-decoration:none; padding:10px 18px;
      border-radius:10px; font-weight:700; font-size:13px;
    }
  </style>
</head>
<body>

  <!-- ==========================================================================================
       CONFIGURACIÓN — cambiar SOLO esta línea si el ID de despliegue de la Web App cambia
       (por ejemplo al publicar una nueva versión con "Implementar > Nueva implementación").
       PEGA AQUÍ TU URL REAL — la misma que ya tenías funcionando en la versión anterior.
       ========================================================================================== -->
  <script>
    var URL_WEBAPP_GAS = "https://script.google.com/macros/s/TU_ID_DE_DESPLIEGUE_AQUI/exec?page=tecnicos";
  </script>

  <div id="splash">
    <div class="logo">S</div>
    <div class="anillo"></div>
    <div class="txt">Abriendo SERTEC…</div>
  </div>

  <div id="avisoError">
    <div class="caja">
      <h1>No se pudo abrir el Portal Técnico</h1>
      <p>Revisa tu conexión a internet, o que la URL en <code>index.html</code> (variable
        <code>URL_WEBAPP_GAS</code>) sea la correcta y esté publicada con acceso habilitado.</p>
      <a id="btnReintentar" href="#">Reintentar</a>
    </div>
  </div>

  <script>
    (function () {
      // Redirección de página completa (NO iframe): así google.script.run funciona exactamente
      // igual que al abrir la URL directo en el navegador, sin el bloqueo de terceros que
      // ocurre cuando Apps Script queda anidado dentro de un iframe de otro dominio.
      // location.replace (no .href) para que esta pantalla de splash no quede en el historial
      // — al presionar "atrás" en la app, Android sale de la app en vez de volver al splash vacío.
      try {
        document.getElementById("btnReintentar").href = URL_WEBAPP_GAS;
        window.location.replace(URL_WEBAPP_GAS);
      } catch (e) {
        document.getElementById("splash").style.display = "none";
        document.getElementById("avisoError").classList.add("visible");
      }

      // Registro del Service Worker del SHELL (este index.html + manifest + íconos). Solo cubre
      // esta pantalla de splash inicial; el contenido real de la app vive en script.google.com,
      // fuera del alcance de este Service Worker (dominio distinto).
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("sw.js").catch(function (e) {
            console.warn("Service Worker no registrado (no crítico):", e);
          });
        });
      }
    })();
  </script>

</body>
</html>
